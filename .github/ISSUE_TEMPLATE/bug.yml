name: Bug report
description: Something in the plugin does not work.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of the doctor verb
      description: >-
        Run `/opencode:setup` and choose doctor, or run the companion's
        `doctor` verb directly. Redact anything sensitive.
      render: text
    validations:
      required: false
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin version, `opencode --version`, `node --version`, and your OS.
    validations:
      required: true
