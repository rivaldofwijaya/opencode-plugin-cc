name: Feature request
description: Suggest something the plugin should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the plugin makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. A rough shape is fine.
    validations:
      required: false
