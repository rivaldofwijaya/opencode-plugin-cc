name: Release

# Cutting a release is pushing a v* tag. Notes are generated from the
# commits since the previous tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # A tag that cannot pass its own suite should not become a release.
      - name: Run the hermetic suite
        run: npm test

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
